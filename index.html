<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expedition timeline</title>
<style>
  :root{
    --wm-font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --page:#fcfcfb; --panel:#f1efe8; --line:rgba(11,11,11,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{--page:#1a1a19; --panel:#232322; --line:rgba(255,255,255,.10)}
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px 20px 48px;background:var(--page);color:var(--c-ink);
       font-family:var(--wm-font);font-size:15px;line-height:1.6}
  main{max-width:720px;margin:0 auto}
  h1{font-size:20px;font-weight:500;margin:0 0 2px}
  .sub{color:var(--c-inkMuted);font-size:13px;margin:0 0 24px}
  #chart svg{display:block;width:100%;height:auto}
  .panel{background:var(--panel);border-radius:8px;padding:14px 16px;margin:20px 0 0;font-size:14px}
  .panel h2{font-size:14px;font-weight:500;margin:0 0 8px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  input[type=number],input[type=text],select{font:inherit;padding:6px 8px;
    border:.5px solid var(--line);border-radius:6px;background:var(--page);color:var(--c-ink)}
  input[type=number]{width:88px}
  input[type=text]{width:150px}
  button{font:inherit;padding:6px 12px;border:.5px solid var(--line);border-radius:6px;
    background:var(--page);color:var(--c-ink);cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  #freeOut{color:var(--c-inkMuted);margin:8px 0 0}
  .warn{border-left:3px solid var(--c-conflict);padding-left:13px}
  .warn h2{color:var(--c-conflict)}
  ul{margin:6px 0 0;padding-left:20px}
  footer{margin-top:28px;font-size:12px;color:var(--c-hint)}
</style>
</head>
<body>
<main>
  <h1>Expedition timeline</h1>
  <p class="sub" id="sub">Loading&hellip;</p>
  <div id="chart"></div>

  <div class="panel" id="pagePanel" hidden>
    <div class="row">
      <label for="show">Showing</label>
      <select id="show">
        <option value="window">Characters in this window</option>
        <option value="active">All active characters</option>
        <option value="all">Everyone, including retired</option>
      </select>
      <input type="text" id="find" placeholder="Find a character">
    </div>
    <div class="row" style="margin-top:10px">
      <button id="older">&larr; Earlier</button>
      <button id="newer">Later &rarr;</button>
      <button id="latest">Latest</button>
      <label for="jump" style="margin-left:6px">Jump to day</label>
      <input type="number" id="jump" step="1">
      <button id="go">Go</button>
      <span id="jumpDate" style="color:var(--c-hint);font-size:13px"></span>
    </div>
    <p id="viewOut" style="margin:10px 0 0;color:var(--c-inkMuted);font-size:13px"></p>
  </div>

  <div class="panel" id="freePanel" hidden>
    <h2>Who is free?</h2>
    <div class="row">
      <label for="freeDay">Departing on day</label>
      <input type="number" id="freeDay" step="1">
      <span id="freeDate" style="color:var(--c-hint);font-size:13px"></span>
    </div>
    <p id="freeOut"></p>
  </div>

  <div class="panel warn" id="conflictPanel" hidden>
    <h2>Timeline conflicts</h2>
    <ul id="conflictList"></ul>
  </div>

  <footer id="foot"></footer>
</main>

<script src="chart.js"></script>
<script>
(function () {
'use strict';

// -- CONFIG -----------------------------------------------------------------
// Option A, simplest: publish each tab to the web as CSV and paste the three URLs.
var SHEETS = {
  expeditions: 'PASTE_EXPEDITIONS_CSV_URL',
  roster:      'PASTE_ROSTER_CSV_URL',
  characters:  'PASTE_CHARACTERS_CSV_URL'
};

// Option B, fresher: deploy Code.gs as a web app and paste its /exec URL here.
// When this is set the three URLs above are ignored.
var WEB_APP_URL = '';
// ---------------------------------------------------------------------------

var C = window.WMChart;
document.head.insertAdjacentHTML('beforeend', '<style>' + C.chartCSS() + '</style>');

var state = { data: null, endDay: null, queryDay: null, show: 'window', find: '' };

function parseCSV(text) {
  var rows = [], row = [], f = '', q = false, i, c;
  text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  for (i = 0; i < text.length; i++) {
    c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  if (!rows.length) return [];
  var head = rows.shift().map(function (h) {
    return h.trim().toLowerCase().replace(/\s+/g, '_');
  });
  return rows.filter(function (r) {
    return r.some(function (v) { return v.trim() !== ''; });
  }).map(function (r) {
    var o = {};
    head.forEach(function (h, k) { o[h] = (r[k] == null ? '' : r[k]).trim(); });
    return o;
  });
}

function bust(url) {
  return url + (url.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now();
}

function get(url) {
  return fetch(bust(url), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    return r.text();
  });
}

// Full model: every character, every expedition. Used for availability queries.
function fullModel() {
  var m = C.buildModel({
    expeditions: state.data.expeditions,
    roster: state.data.roster,
    characters: state.data.characters,
    queryDay: state.queryDay
  });
  if (state.endDay !== null && state.endDay !== m.dayMax) {
    m.dayMin = state.endDay - C.SPEC.WINDOW_DAYS;
    m.dayMax = state.endDay;
  }
  return m;
}

// Which rows to actually draw. A campaign accumulates characters forever, so the default
// shows only those the visible window says anything about. Everyone stays in the data.
function pickRows(m) {
  var q = state.find.trim().toLowerCase();
  if (q) {
    return m.characters.filter(function (c) {
      return c.name.toLowerCase().indexOf(q) > -1;
    });
  }
  return m.characters.filter(function (c) {
    if (state.show !== 'all' && c.status !== 'active') return false;
    if (state.show !== 'window') return true;
    var inWindow = c.bars.some(function (b) {
      return b.endDay > m.dayMin && b.startDay < m.dayMax;
    });
    return inWindow || (c.currentDay >= m.dayMin && c.currentDay <= m.dayMax);
  });
}

function draw() {
  var m = fullModel();
  var total = m.characters.length;
  m.characters = pickRows(m);
  document.getElementById('chart').innerHTML = C.renderChart(m);

  var hidden = total - m.characters.length;
  document.getElementById('viewOut').textContent =
    C.formatLong(m.dayMin) + ' to ' + C.formatLong(m.dayMax) +
    ' \u00b7 ' + m.characters.length + ' of ' + total + ' characters' +
    (hidden ? ' \u00b7 ' + hidden + ' hidden' : '');

  var p = new URLSearchParams();
  p.set('end', state.endDay);
  if (state.queryDay !== null) p.set('day', state.queryDay);
  if (state.show !== 'window') p.set('show', state.show);
  history.replaceState(null, '', '?' + p.toString());
  return m;
}

function refreshFree() {
  var m = fullModel();
  var d = Number(document.getElementById('freeDay').value);
  var names = C.freeOn(m, d);
  document.getElementById('freeDate').textContent = isFinite(d) ? C.formatLong(d) : '';
  document.getElementById('freeOut').textContent =
    names.length ? names.join(', ') : 'Nobody is available that day.';
}

function mount(data, note) {
  state.data = data;
  var m = C.buildModel(data);
  var url = new URLSearchParams(location.search);
  state.endDay = Number(url.get('end')) || m.dayMax;
  state.queryDay = url.has('day') ? Number(url.get('day')) : m.dayMax - 10;
  if (['window', 'active', 'all'].indexOf(url.get('show')) > -1) state.show = url.get('show');

  document.getElementById('sub').textContent = note;
  document.getElementById('freePanel').hidden = false;
  document.getElementById('pagePanel').hidden = false;

  var day = document.getElementById('freeDay');
  day.value = state.queryDay;
  day.addEventListener('input', function () {
    var v = Number(day.value);
    state.queryDay = isFinite(v) ? v : null;
    draw();
    refreshFree();
  });

  var full = C.buildModel(data);
  var floor = (full.expeditions.length ? full.expeditions[0].startDay : 0) + C.SPEC.WINDOW_DAYS;

  function goTo(end) {
    state.endDay = Math.max(floor, Math.min(full.dayMax, Math.round(end)));
    draw();
    sync();
  }
  function sync() {
    document.getElementById('older').disabled = state.endDay <= floor;
    document.getElementById('newer').disabled = state.endDay >= full.dayMax;
    document.getElementById('latest').disabled = state.endDay >= full.dayMax;
    document.getElementById('jump').value = state.endDay;
    document.getElementById('jumpDate').textContent = C.formatLong(state.endDay);
  }

  document.getElementById('older').onclick = function () { goTo(state.endDay - 25); };
  document.getElementById('newer').onclick = function () { goTo(state.endDay + 25); };
  document.getElementById('latest').onclick = function () { goTo(full.dayMax); };
  document.getElementById('go').onclick = function () {
    goTo(Number(document.getElementById('jump').value));
  };
  document.getElementById('jump').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') goTo(Number(this.value));
  });
  document.getElementById('jump').addEventListener('input', function () {
    var v = Number(this.value);
    document.getElementById('jumpDate').textContent = isFinite(v) ? C.formatLong(v) : '';
  });

  var showSel = document.getElementById('show');
  showSel.value = state.show;
  showSel.addEventListener('change', function () {
    state.show = this.value;
    draw();
  });

  var find = document.getElementById('find');
  find.addEventListener('input', function () {
    state.find = this.value;
    showSel.disabled = this.value.trim() !== '';
    draw();
  });

  draw();
  sync();
  refreshFree();

  if (m.conflicts.length) {
    document.getElementById('conflictPanel').hidden = false;
    document.getElementById('conflictList').innerHTML = m.conflicts.map(function (c) {
      return '<li>' + c.character + ' is on ' + c.a.name + ' and ' + c.b.name +
             ' at the same time (' + C.formatDay(c.startDay) + ' to ' +
             C.formatDay(c.endDay) + ', days ' + c.startDay + '\u2013' + c.endDay + ')</li>';
    }).join('');
  }

  document.getElementById('foot').textContent =
    'Chart spec v' + C.SPEC.version + ' \u00b7 ' + m.expeditions.length + ' expeditions \u00b7 ' +
    m.characters.length + ' characters \u00b7 loaded ' + new Date().toLocaleString();
}

function fail(err) {
  var msg = 'Could not read the sheet: ' + err.message + '. ';
  if (location.protocol === 'file:') {
    msg += 'Opening the page from a file can block network requests in some browsers. ' +
           'Publishing to GitHub Pages resolves this.';
  } else {
    msg += 'Check the tabs are still published to the web.';
  }
  document.getElementById('sub').textContent = msg;
}

function main() {
  var demo = location.search.indexOf('demo') > -1;
  if (demo || (!WEB_APP_URL && SHEETS.expeditions.indexOf('PASTE_') === 0)) {
    mount(C.DEMO, 'Demo data. Set the CSV URLs or WEB_APP_URL in index.html to go live.');
    return;
  }
  if (WEB_APP_URL) {
    get(WEB_APP_URL).then(function (t) {
      var d = JSON.parse(t);
      mount(d, 'Live from the campaign sheet. Updates appear immediately.');
    }).catch(fail);
    return;
  }
  Promise.all([
    get(SHEETS.expeditions),
    get(SHEETS.roster),
    SHEETS.characters.indexOf('PASTE_') === 0 ? Promise.resolve('') : get(SHEETS.characters)
  ]).then(function (t) {
    mount({
      expeditions: parseCSV(t[0]),
      roster: parseCSV(t[1]),
      characters: t[2] ? parseCSV(t[2]) : []
    }, 'Live from the campaign sheet. Google caches published sheets for about five minutes.');
  }).catch(fail);
}

main();
})();
</script>
</body>
</html>
